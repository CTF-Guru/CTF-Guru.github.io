<title>ctf.guru — Farooq Ali</title>
<style>
  /* dark = default (first visit) */
  :root{
    --bg:#0b0b0b; --panel:#141414; --panel2:#0f0f10; --line:#262626; --hover:#17181a;
    --ink:#f5f5f5; --muted:#bdbdbd; --dim:#8c8c8c;
    --gold:#E9BF35; --blue:#5AA9EC; --teal:#3AD0B0; --orange:#FE9A3A; --green:#81BB42; --red:#FF5A4D; --purple:#9B5DE5;
    --flash-hi:#fff3c4; --flash-peak:#ffffff;   /* the "Flash" sweep peaks bright on black */
    --shadow:rgba(0,0,0,.55); --thumbline:#2f2f2f;
    --font:'Century Gothic','Futura','Avenir Next',system-ui,sans-serif;
  }
  .wrap.light{
    --bg:#f6f5f2; --panel:#ffffff; --panel2:#efeeea; --line:#e3e2dc; --hover:#f0efe9;
    --ink:#1a1a17; --muted:#57564f; --dim:#86857c;
    --gold:#b4890b; --blue:#2f7fc7; --teal:#128a70; --orange:#c96a00; --green:#5a8a1f; --red:#c8342a; --purple:#6b3fc0;
    --flash-hi:#b4890b; --flash-peak:#7a4f05;   /* on a WHITE panel the sweep must peak DARK, or "Flash" vanishes */
    --shadow:rgba(20,20,20,.16); --thumbline:#dcdbd4;
  }
  *{ box-sizing:border-box }
  html,body{ margin:0; padding:0; background:#0b0b0b }
  .wrap{ background:var(--bg); color:var(--ink); font-family:var(--font); min-height:100vh; padding:0 22px;
         transition:background .2s ease, color .2s ease }
  .inner{ max-width:960px; margin:0 auto; padding:58px 0 40px }
  .eyebrow{ font-size:.72rem; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); font-weight:700 }

  /* theme toggle */
  .themebtn{ position:fixed; top:16px; right:16px; z-index:30; width:38px; height:38px; border-radius:999px;
             background:var(--panel); border:1px solid var(--line); color:var(--muted); cursor:pointer;
             display:flex; align-items:center; justify-content:center; transition:color .15s ease, border-color .15s ease }
  .themebtn:hover{ color:var(--gold); border-color:var(--gold) }
  .themebtn svg{ width:18px; height:18px }
  .themebtn .moon{ display:none }
  .wrap.light .themebtn .sun{ display:none }
  .wrap.light .themebtn .moon{ display:block }

  /* LinkedIn — top-right, beside the theme toggle */
  .lnbtn{ position:fixed; top:16px; right:62px; z-index:30; width:38px; height:38px; border-radius:999px;
          background:var(--panel); border:1px solid var(--line); color:var(--muted); text-decoration:none;
          display:flex; align-items:center; justify-content:center; transition:color .15s ease, border-color .15s ease }
  .lnbtn:hover{ color:var(--gold); border-color:var(--gold) }
  .lnbtn svg{ width:18px; height:18px; display:block }

  /* hero */
  .hero{ display:flex; align-items:flex-start; justify-content:space-between; gap:26px; padding-bottom:32px; border-bottom:1px solid var(--line) }
  .hero-left{ display:flex; align-items:flex-start; gap:22px; min-width:0 }
  .shield{ width:76px; height:82px; flex:0 0 76px; transform-origin:center;
           filter:drop-shadow(0 0 6px rgba(90,169,236,.30)); animation:beacon 2.6s ease-in-out infinite }
  @keyframes beacon{
    0%,100%{ transform:scale(1);    filter:drop-shadow(0 0 5px rgba(90,169,236,.30)) }
    50%    { transform:scale(1.07); filter:drop-shadow(0 0 22px rgba(90,169,236,.62)) }
  }
  .hero h1{ margin:5px 0 0; font-size:2.15rem; font-weight:800; letter-spacing:.01em; color:var(--gold); text-wrap:balance; line-height:1.05 }
  .hero h1 span{ color:var(--ink) }
  .hero .role{ margin:5px 0 0; color:var(--dim); font-size:.95rem; font-weight:600; letter-spacing:.02em }
  .hero .lede{ margin:14px 0 0; color:var(--ink); font-size:1.15rem; max-width:40ch; line-height:1.4; font-weight:600 }
  .hero .lede b{ color:var(--gold); font-weight:700 }

  /* collage — fanned mix of infographics + Medium articles */
  .collage{ flex:0 0 auto; display:flex; align-items:flex-start; padding:4px 6px 0 0 }
  .cc{ width:112px; height:150px; flex:0 0 112px; border-radius:6px; border:1px solid var(--thumbline);
       box-shadow:0 10px 26px var(--shadow); margin-left:-42px; overflow:hidden; text-decoration:none; transition:transform .2s ease }
  .cc:first-child{ margin-left:0 }
  .cc:nth-child(1){ transform:rotate(-6deg); z-index:1 }
  .cc:nth-child(2){ transform:rotate(-2deg) translateY(-7px); z-index:2 }
  .cc:nth-child(3){ transform:rotate(2deg) translateY(-3px); z-index:3 }
  .cc:nth-child(4){ transform:rotate(6deg); z-index:4 }
  .collage:hover .cc:nth-child(1){ transform:rotate(-10deg) translateX(-5px) }
  .collage:hover .cc:nth-child(4){ transform:rotate(10deg) translateX(5px) }
  .pc img{ width:100%; height:100%; object-fit:cover; object-position:top; display:block }
  .ac{ background:var(--panel); padding:11px; display:flex; flex-direction:column; gap:6px }
  .ac .k{ font-size:.54rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700 }
  .ac .h{ font-size:.72rem; font-weight:700; line-height:1.24; color:var(--ink); flex:1;
          display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden }
  .ac .r{ font-size:.56rem; color:var(--dim); font-variant-numeric:tabular-nums }

  .sec{ margin-top:42px }
  .sec > .head{ display:flex; align-items:baseline; gap:12px; margin-bottom:16px }
  .sec .note{ color:var(--dim); font-size:.85rem }

  /* library cards */
  .libs{ display:grid; grid-template-columns:1fr 1fr; gap:16px }

  /* News Flash strip — sits ABOVE the libraries because it is the thing that changes weekly, and
     it is the reason to come back. The motion is deliberately the product's OWN: the bolt pulses on
     the same 2.4s beat as Newsflash-icon.svg and "Flash" burns with the same sweep as the slide
     masthead, so this reads as the same thing you land on at /newsflash/.
     The fire is built from theme tokens, NOT hard-coded hexes: light mode's --panel is pure white,
     so the dark sweep's #ffffff peak would make "Flash" invisible on it. --flash-hi/--flash-peak
     flip with the theme and keep the sweep legible on both. */
  .nfwrap{ margin-top:38px }
  .nfbar{ display:flex; align-items:center; gap:16px; padding:15px 20px; border:1px solid var(--line);
    border-radius:20px; background:var(--panel); box-shadow:0 10px 26px var(--shadow);
    text-decoration:none; color:var(--ink); transition:border-color .18s, transform .18s }
  .nfbar:hover{ border-color:var(--gold); transform:translateY(-2px) }
  .nfico{ width:30px; height:30px; flex:none; color:var(--gold) }
  .nfico svg{ width:100%; height:100%; transform-origin:50% 50%; animation:nf-pulse 2.4s ease-in-out infinite }
  @keyframes nf-pulse{
    0%,100%{ opacity:1;   transform:scale(1) }
    50%    { opacity:.62; transform:scale(1.14) }
  }
  .nfmain{ display:flex; flex-direction:column; gap:1px; min-width:0 }
  .nft{ font-weight:800; font-size:1.1rem; letter-spacing:.01em }
  .nft .fl{ background:linear-gradient(100deg,var(--red) 0%,var(--orange) 24%,var(--flash-hi) 45%,
      var(--flash-peak) 50%,var(--flash-hi) 55%,var(--orange) 76%,var(--red) 100%);
    background-size:260% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 2.1s linear infinite }
  @keyframes shine{ 0%{ background-position:0% center } 100%{ background-position:260% center } }
  .nfd{ color:var(--muted); font-size:.9rem }
  .nfchip{ flex:none; color:var(--gold); border-color:var(--gold) }
  .nfgo{ margin-left:auto; color:var(--gold); font-weight:800; white-space:nowrap; flex:none }
  @media(max-width:720px){
    .nfbar{ flex-wrap:wrap; gap:10px }
    .nfgo{ margin-left:0; width:100% }
  }
  .lib{ display:flex; flex-direction:column; gap:11px; text-decoration:none; color:inherit;
        background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--ac);
        border-radius:12px; padding:18px 20px; transition:transform .15s ease, border-color .15s ease, background .15s ease }
  .lib:hover{ transform:translateY(-3px); background:var(--hover); border-color:var(--ac) }
  .lib:focus-visible{ outline:2px solid var(--ac); outline-offset:3px }
  .lh{ display:flex; align-items:center; justify-content:space-between; gap:10px }
  .ic{ width:30px; height:30px; color:var(--ac); flex:0 0 30px }
  .ic svg{ width:100%; height:100%; display:block }
  .chip{ font-size:.68rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
         color:var(--ac); border:1px solid var(--ac); border-radius:999px; padding:3px 10px; opacity:.9 }
  .lib .t{ font-size:1.28rem; font-weight:800; color:var(--ink) }
  .lib .d{ color:var(--muted); font-size:.92rem; line-height:1.5; flex:1 }
  .lib .go{ color:var(--ac); font-weight:700; font-size:.9rem }

  /* writing */
  .arts{ display:flex; flex-direction:column; gap:10px }
  .art{ display:flex; justify-content:space-between; align-items:center; gap:18px; text-decoration:none; color:inherit;
        background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:15px 18px;
        transition:border-color .15s ease, background .15s ease }
  .art:hover{ border-color:var(--gold); background:var(--hover) }
  .art:focus-visible{ outline:2px solid var(--gold); outline-offset:3px }
  .art .at{ font-weight:700; color:var(--ink); font-size:1rem; text-wrap:balance }
  .art .ab{ color:var(--dim); font-size:.85rem; margin-top:3px; max-width:70ch; line-height:1.45 }
  .art .m{ color:var(--dim); font-size:.78rem; white-space:nowrap; font-variant-numeric:tabular-nums }
  .cta{ display:inline-flex; align-items:center; gap:8px; margin-top:16px; color:var(--gold); text-decoration:none; font-weight:700; font-size:.9rem }
  .cta:hover{ text-decoration:underline }

  footer{ margin-top:54px; padding-top:18px; border-top:1px solid var(--line);
          display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; color:var(--dim); font-size:.82rem }
  footer .fb{ display:flex; align-items:center; gap:9px; font-weight:700; color:var(--muted) }
  footer .fb .fs{ width:22px; height:24px }
  footer .fb .tag{ color:var(--dim); font-weight:600; font-size:.76rem }
  footer .fright{ display:inline-flex; align-items:center; gap:14px }
  footer .social{ color:var(--muted); display:inline-flex; transition:color .15s ease }
  footer .social:hover{ color:var(--gold) }
  footer .social svg{ width:18px; height:18px; display:block }
  footer .home{ color:var(--gold); text-decoration:none; font-weight:700 }

  @media (max-width:800px){ .collage{ display:none } }
  @media (max-width:640px){
    .wrap{ padding:0 16px }
    .inner{ padding:42px 0 34px }
    .libs{ grid-template-columns:1fr }
    .hero h1{ font-size:1.75rem }
    .hero .lede{ font-size:1.05rem }
    .hero-left{ gap:16px }
    .shield{ width:60px; height:65px; flex-basis:60px }
    .art{ flex-direction:column; align-items:flex-start; gap:4px }
    .art .m{ white-space:normal }
  }
  @media (max-width:380px){ .hero h1{ font-size:1.55rem } .themebtn{ top:10px; right:10px } .lnbtn{ top:10px; right:52px } }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important } .shield,.nfico svg,.nft .fl{ animation:none }
    .nft .fl{ background:none; color:var(--orange) }   /* clipped-text needs a real colour once the sweep stops */
  }
</style>
</head>
<body>
<div class="wrap"><div class="inner">

  <a class="lnbtn" href="https://www.linkedin.com/in/farooqali/" target="_blank" rel="noopener" aria-label="Farooq Ali on LinkedIn">

<script>
  // theme — dark by default on first visit, remembered thereafter
  (function(){
    var wrap=document.querySelector('.wrap');
    function sync(){ document.body.style.background = wrap.classList.contains('light') ? '#f6f5f2' : '#0b0b0b'; }
    if(localStorage.getItem('ctf-theme')==='light') wrap.classList.add('light');
    sync();
    document.getElementById('theme').addEventListener('click', function(){
      wrap.classList.toggle('light');
      localStorage.setItem('ctf-theme', wrap.classList.contains('light') ? 'light' : 'dark');
      sync();
    });
  })();

  const ICONS = {
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="9.5" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/><circle cx="12" cy="15" r="1.3"/></svg>',
    chip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><rect x="10.5" y="10.5" width="3" height="3" rx="0.5"/><path d="M10 3v2.5M14 3v2.5M10 18.5V21M14 18.5V21M3 10h2.5M3 14h2.5M18.5 10H21M18.5 14H21"/></svg>',
    // Same polygon as the canonical News Flash mark (newsflash-builder assets/Newsflash-icon.svg),
    // so the card here and the product at ctf.guru/newsflash read as one thing.
    bolt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>'
  };
  const TOPICS = [
    { name:'Security', icon:'lock', chip:'51 explainers', ac:'var(--teal)', href:'/security/',
      desc:'Auth & identity, cloud posture, OWASP, MITRE, AI security, and GRC & compliance — one page per concept, a PNG for handouts and an animated GIF for socials.' },
    { name:'AI', icon:'chip', chip:'25 explainers', ac:'var(--blue)', href:'/ai/',
      desc:'Model Context Protocol, agents, RAG, memory and the security around them — the building blocks of modern AI, one page each.' },
  ];

  // The news flash is NOT an explainer library, so it gets its own section rather than a third
  // card under that heading. Gold leads here because the card spans both topics and so can be
  // neither teal (security) nor blue (AI) — and gold is the News Flash mark's own colour.
  const NEWS = { name:'News Flash', icon:'bolt', chip:'weekly', href:'/newsflash/',
    desc:'AI &amp; security &mdash; what actually moved in the last 30 days, with a primary source on every item.' };

  const MEDIUM_URL = 'https://medium.com/@GaMechanic';
  const WRITING = [
    { title:'G²RID: The Borg Effect and the Case for Decentralized AI Inference', meta:'27 min',
      blurb:'Billions in compute power is doing nothing right now. That’s about to change.',
      href:'https://medium.com/@GaMechanic/g²rid-the-borg-effect-and-the-case-for-decentralized-ai-inference-03b02ab4dc81' },
    { title:'Everyone Is Using AI. No One Is REALLY Using AI. A Modern Fable', meta:'13 min',
      blurb:'A fable about the gap between touching AI and truly using it.',
      href:'https://medium.com/@GaMechanic/everyone-is-using-ai-no-one-is-really-using-ai-a-modern-fable-915caff622e4' },
    { title:'Are AI Tokens the New Oil?', meta:'14 min',
      blurb:'The real power in oil was never the oil — it was the refineries, futures, and pipelines. Tokens are next.',
      href:'https://medium.com/@GaMechanic/are-ai-tokens-the-new-oil-f3a835b4af79' },
    { title:'Are We Handicapping AI by Making It Think Like Us?', meta:'10 min',
      blurb:'75 years building bridges to silicon — and questioning whether we still need them.',
      href:'https://medium.com/@GaMechanic/are-we-handicapping-ai-by-making-it-think-like-us-a71960e0b263' },

  document.getElementById('libs').innerHTML = TOPICS.map(function(t){
    return '<a class="lib" style="--ac:'+t.ac+'" href="'+t.href+'">'
      + '<div class="lh"><span class="ic">'+ICONS[t.icon]+'</span><span class="chip">'+t.chip+'</span></div>'

      + '<span class="d">'+t.desc+'</span>'
      + '<span class="go">Browse '+t.name.toLowerCase()+' &rarr;</span></a>';
  }).join('');

  document.getElementById('news').innerHTML = (function(t){
    return '<a class="nfbar" href="'+t.href+'">'

      + '<span class="nfgo">Read the latest &rarr;</span></a>';
  })(NEWS);

  document.getElementById('arts').innerHTML = WRITING.map(function(a){

  document.getElementById('collage').innerHTML = COLLAGE.map(function(c){
